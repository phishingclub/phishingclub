services:
  phishingclub:
    image: ghcr.io/phishingclub/phishingclub:latest

    container_name: phishingclub
    restart: unless-stopped
    # run a small init as PID 1 that reaps exited processes, so the helper
    # processes of the report browser do not stay as zombies
    init: true

    # Mount config and data directories
    volumes:
      - ./config:/app/config
      - ./data:/app/data

    ports:
      - "80:8080" # HTTP phishing server
      - "443:8443" # HTTPS phishing server
      - "8000:8000" # Admin interface

    networks:
      - phishingclub

networks:
  phishingclub:
    driver: bridge
